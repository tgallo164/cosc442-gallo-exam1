name: JoshHack CI / Mutation Testing

on: [push, pull_request]

jobs:
  build-and-mutate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./JoshHack

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Grant execute permission for Maven wrapper
      run: chmod +x mvnw

    - name: Run SpotBugs
      run: ./mvnw compile spotbugs:spotbugs

    - name: Run JUnit Tests
      run: ./mvnw test

    - name: Run PIT Mutation Tests
      run: ./mvnw pitest:mutationCoverage

    - name: Upload PIT Mutation Report
      uses: actions/upload-artifact@v4
      with:
        name: pit-reports
        path: target/pit-reports/

    - name: Upload SpotBugs SARIF to GitHub Code Scanning
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: JoshHack/target/spotbugsSarif.json
        category: spotbugs